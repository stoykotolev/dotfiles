# Symlinked from ~/Library/Application Support/lazygit/config.yml.
# Theme hexes mirror nvim/lua/yugure/palette.lua.
gui:
  nerdFontsVersion: "3"
  mouseEvents: false
  theme:
    activeBorderColor:
      - "#7FAEC4" # foam
      - bold
    inactiveBorderColor:
      - "#373E4F" # high
    searchingActiveBorderColor:
      - "#CFA875" # gold
      - bold
    optionsTextColor:
      - "#7FAEC4" # foam
    selectedLineBgColor:
      - "#2B3245" # med
    inactiveViewSelectedLineBgColor:
      - "#1F232E" # overlay
    cherryPickedCommitFgColor:
      - "#14171F" # base
    cherryPickedCommitBgColor:
      - "#A492C9" # iris
    markedBaseCommitFgColor:
      - "#14171F" # base
    markedBaseCommitBgColor:
      - "#CFA875" # gold
    unstagedChangesColor:
      - "#C96A70" # love
    defaultFgColor:
      - "#B2BACC" # text
