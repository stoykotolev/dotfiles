[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/opt/homebrew/bin/fish"

[font]
size = 16

[font.bold]
style = "Bold"

[font.bold_italic]
style = "Bold Italic"

[font.italic]
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 0

[window]
decorations = "None"

[window.position]
y = 200
x = 420

[window.padding]
x = 2
y = 2

[window.dimensions]
columns = 120
lines = 39

# Colors (Yūgure) — mirrors nvim/lua/yugure/palette.lua and terminal.lua.
# Default fg sits one tier below nvim's Normal (iron, not text) and the
# bright-white slot is text: terminal prose is dimmer than code on purpose.

[colors.primary]
background = '#14171F'
foreground = '#A2ABBE'
dim_foreground = '#8F99AF'
bright_foreground = '#B2BACC'

[colors.cursor]
text = '#14171F'
cursor = '#A2ABBE'

[colors.vi_mode_cursor]
text = '#14171F'
cursor = '#CFA875'

[colors.search.matches]
foreground = '#A2ABBE'
background = '#2C3F53'

[colors.search.focused_match]
foreground = '#14171F'
background = '#CFA875'

[colors.footer_bar]
foreground = '#8F99AF'
background = '#1F232E'

[colors.hints.start]
foreground = '#14171F'
background = '#CFA875'

[colors.hints.end]
foreground = '#14171F'
background = '#7FAEC4'

[colors.selection]
text = 'CellForeground'
background = '#2B3245'

[colors.normal]
black = '#1F232E'
red = '#C96A70'
green = '#82ABAA'
yellow = '#CFA875'
blue = '#7FAEC4'
magenta = '#A492C9'
cyan = '#C98995'
white = '#A2ABBE'

[colors.bright]
black = '#4A5164'
red = '#CF7C81'
green = '#91B5B4'
yellow = '#D5B286'
blue = '#8EB8CB'
magenta = '#AF9FCF'
cyan = '#CF97A2'
white = '#B2BACC'

[colors.dim]
black = '#191C26'
red = '#A45A5F'
green = '#6B8C8B'
yellow = '#A98A62'
blue = '#698FA1'
magenta = '#8778A5'
cyan = '#A5717B'
white = '#666F87'

[terminal]
