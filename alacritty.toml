[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/opt/homebrew/bin/fish"

[font]
size = 16

[font.bold]
style = "Bold"

[font.bold_italic]
style = "Bold Italic"

[font.italic]
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 0

[window]
decorations = "None"

[window.position]
y = 200
x = 420

[window.padding]
x = 2
y = 2

[window.dimensions]
columns = 120
lines = 39

# Colors (Yūgure) — mirrors nvim/lua/yugure/palette.lua and terminal.lua.
# Default fg sits one tier below nvim's Normal (iron, not text) and the
# bright-white slot is text: terminal prose is dimmer than code on purpose.

[colors.primary]
background = '#141518'
foreground = '#8F97A6'
dim_foreground = '#7F8797'
bright_foreground = '#9DA4B2'

[colors.cursor]
text = '#141518'
cursor = '#8F97A6'

[colors.vi_mode_cursor]
text = '#141518'
cursor = '#BFA077'

[colors.search.matches]
foreground = '#8F97A6'
background = '#2C3745'

[colors.search.focused_match]
foreground = '#141518'
background = '#BFA077'

[colors.footer_bar]
foreground = '#7F8797'
background = '#1F2026'

[colors.hints.start]
foreground = '#141518'
background = '#BFA077'

[colors.hints.end]
foreground = '#141518'
background = '#7AA3B5'

[colors.selection]
text = 'CellForeground'
background = '#2A2C34'

[colors.normal]
black = '#1F2026'
red = '#BA6B70'
green = '#7BA09F'
yellow = '#BFA077'
blue = '#7AA3B5'
magenta = '#9A8EB9'
cyan = '#B98590'
white = '#8F97A6'

[colors.bright]
black = '#454A58'
red = '#C27D81'
green = '#8BABAB'
yellow = '#C7AB87'
blue = '#8AAEBE'
magenta = '#A69CC1'
cyan = '#C1949D'
white = '#9DA4B2'

[colors.dim]
black = '#18191D'
red = '#95565A'
green = '#62807F'
yellow = '#99805F'
blue = '#628291'
magenta = '#7B7294'
cyan = '#946A73'
white = '#5E6577'

[terminal]
