[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/opt/homebrew/bin/fish"

[font]
size = 16

[font.bold]
style = "Bold"

[font.bold_italic]
style = "Bold Italic"

[font.italic]
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 0

[window]
decorations = "None"

[window.position]
y = 200
x = 420

[window.padding]
x = 2
y = 2

[window.dimensions]
columns = 120
lines = 39

# Colors (Yūgure) — mirrors nvim/lua/yugure/palette.lua and terminal.lua.
# Keep the two in sync: ANSI 0-15 here == vim.g.terminal_color_0..15.

[colors.primary]
background = '#191C24'
foreground = '#B2BACC'
dim_foreground = '#8F99AF'
bright_foreground = '#D7DBE4'

[colors.cursor]
text = '#191C24'
cursor = '#B2BACC'

[colors.vi_mode_cursor]
text = '#191C24'
cursor = '#CFA875'

[colors.search.matches]
foreground = '#B2BACC'
background = '#2F4256'

[colors.search.focused_match]
foreground = '#191C24'
background = '#CFA875'

[colors.footer_bar]
foreground = '#8F99AF'
background = '#242833'

[colors.hints.start]
foreground = '#191C24'
background = '#CFA875'

[colors.hints.end]
foreground = '#191C24'
background = '#7FAEC4'

[colors.selection]
text = 'CellForeground'
background = '#2E3548'

[colors.normal]
black = '#242833'
red = '#C96A70'
green = '#82ABAA'
yellow = '#CFA875'
blue = '#7FAEC4'
magenta = '#A492C9'
cyan = '#C98995'
white = '#B2BACC'

[colors.bright]
black = '#666F87'
red = '#CF7C81'
green = '#91B5B4'
yellow = '#D5B286'
blue = '#8EB8CB'
magenta = '#AF9FCF'
cyan = '#CF97A2'
white = '#D7DBE4'

[colors.dim]
black = '#1E212B'
red = '#A45A5F'
green = '#6B8C8B'
yellow = '#A98A62'
blue = '#698FA1'
magenta = '#8778A5'
cyan = '#A5717B'
white = '#8F99AF'

