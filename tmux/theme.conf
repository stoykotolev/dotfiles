# Yūgure status line — hexes mirror nvim/lua/yugure/palette.lua.
# Accents are used as text on the med layer, never as solid fills, to keep
# the bar quieter than the editor.
#   base #141518  low #1B1C21  overlay #1F2026  med #2A2C34  high #383A43
#   text #9DA4B2  iron #8F97A6  subtle #7F8797  muted #5E6577
#   rose #B98590  gold #BFA077  foam #7AA3B5  teal #7BA09F  love #BA6B70

set -g mode-style "fg=#9DA4B2,bg=#2A2C34"

set -g message-style "fg=#9DA4B2,bg=#1F2026"
set -g message-command-style "fg=#BFA077,bg=#1F2026"

# Inactive borders vanish into the editor background; the active one is
# a quiet mid-grey rather than white.
set -g pane-border-style "fg=#141518"
set -g pane-active-border-style "fg=#383A43"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#5E6577,bg=#1F2026"
set -g status-bg "#1F2026"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#7F8797] #{?window_zoomed_flag,↕,} #[bg=#1F2026,fg=#9DA4B2,bold] #S #[fg=#8F97A6,bg=#2A2C34,nobold,nounderscore,noitalics] #(whoami) #[default] "
set -g status-right "#[fg=#7F8797,bg=#1F2026,nobold,nounderscore,noitalics]%Y-%m-%d | %I:%M %p #[fg=#7BA09F,bg=#2A2C34,nobold] #h "

setw -g window-status-activity-style "underscore,fg=#BFA077,bg=#1F2026"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#5E6577,bg=#1F2026"
setw -g window-status-format '#[fg=#1F2026,bg=#1F2026]#[default] #I #{b:pane_current_path} #[fg=#1F2026,bg=#1F2026,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#2A2C34,bg=#1F2026]#[fg=#7AA3B5,bg=#2A2C34,bold] #I #[fg=#9DA4B2,bg=#2A2C34,nobold] #{b:pane_current_path} #[fg=#2A2C34,bg=#1F2026,nobold]'
