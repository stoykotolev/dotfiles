# Yūgure status line — hexes mirror nvim/lua/yugure/palette.lua.
#   base #191C24  low #20242F  overlay #242833  med #2E3548  high #3A4152
#   text #B2BACC  iron #A2ABBE  subtle #8F99AF  muted #666F87
#   rose #C98995  gold #CFA875  foam #7FAEC4  teal #82ABAA  love #C96A70

set -g mode-style "fg=#B2BACC,bg=#2E3548"

set -g message-style "fg=#B2BACC,bg=#242833"
set -g message-command-style "fg=#CFA875,bg=#242833"

# Inactive borders vanish into the editor background; the active one is
# a quiet mid-grey rather than white.
set -g pane-border-style "fg=#191C24"
set -g pane-active-border-style "fg=#3A4152"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#666F87,bg=#191C24"
set -g status-bg "#191C24"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#CFA875] #{?window_zoomed_flag,↕,} #[bg=#191C24,fg=#B2BACC,bold] #S #[fg=#A2ABBE,bg=#20242F,nobold,nounderscore,noitalics] #(whoami) #[fg=#191C24,bg=#191C24]"
set -g status-right "#[fg=#8F99AF,bg=#191C24,nobold,nounderscore,noitalics]%Y-%m-%d | %I:%M %p #[fg=#191C24,bg=#82ABAA,bold] #h "

setw -g window-status-activity-style "underscore,fg=#CFA875,bg=#191C24"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#666F87,bg=#191C24"
setw -g window-status-format '#[fg=#191C24,bg=#191C24]#[default] #I #{b:pane_current_path} #[fg=#191C24,bg=#191C24,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#191C24,bg=#7FAEC4]#[fg=#191C24,bg=#7FAEC4,bold] #I #[fg=#B2BACC,bg=#2E3548,nobold] #{b:pane_current_path} #[fg=#2E3548,bg=#191C24,nobold]'
