# Yūgure status line — hexes mirror nvim/lua/yugure/palette.lua.
# Accents are used as text on the med layer, never as solid fills, to keep
# the bar quieter than the editor.
#   base #14171F  low #1B1F2A  overlay #1F232E  med #2B3245  high #373E4F
#   text #B2BACC  iron #A2ABBE  subtle #8F99AF  muted #666F87
#   rose #C98995  gold #CFA875  foam #7FAEC4  teal #82ABAA  love #C96A70

set -g mode-style "fg=#B2BACC,bg=#2B3245"

set -g message-style "fg=#B2BACC,bg=#1F232E"
set -g message-command-style "fg=#CFA875,bg=#1F232E"

# Inactive borders vanish into the editor background; the active one is
# a quiet mid-grey rather than white.
set -g pane-border-style "fg=#14171F"
set -g pane-active-border-style "fg=#373E4F"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#666F87,bg=#1F232E"
set -g status-bg "#1F232E"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#8F99AF] #{?window_zoomed_flag,↕,} #[bg=#1F232E,fg=#B2BACC,bold] #S #[fg=#A2ABBE,bg=#2B3245,nobold,nounderscore,noitalics] #(whoami) #[fg=#1F232E,bg=#1F232E]"
set -g status-right "#[fg=#8F99AF,bg=#1F232E,nobold,nounderscore,noitalics]%Y-%m-%d | %I:%M %p #[fg=#82ABAA,bg=#2B3245,nobold] #h "

setw -g window-status-activity-style "underscore,fg=#CFA875,bg=#1F232E"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#666F87,bg=#1F232E"
setw -g window-status-format '#[fg=#1F232E,bg=#1F232E]#[default] #I #{b:pane_current_path} #[fg=#1F232E,bg=#1F232E,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#2B3245,bg=#1F232E]#[fg=#7FAEC4,bg=#2B3245,bold] #I #[fg=#B2BACC,bg=#2B3245,nobold] #{b:pane_current_path} #[fg=#2B3245,bg=#1F232E,nobold]'
